name: Release

on:
  push:
    tags:
      - 'v*'
  workflow_dispatch:

permissions:
  contents: write

jobs:
  build-windows:
    runs-on: windows-latest

    steps:
      - uses: actions/checkout@v4

      - uses: pnpm/action-setup@v4
        with:
          version: 9

      - uses: actions/setup-node@v4
        with:
          node-version: 24
          cache: pnpm

      - name: Electron 캐시
        uses: actions/cache@v4
        with:
          path: ${{ env.LOCALAPPDATA }}\electron\Cache
          key: electron-windows-${{ hashFiles('package.json') }}

      - name: 패키지 설치
        run: pnpm install

      - name: Native 모듈 Electron용 재빌드
        run: npx @electron/rebuild -f -w @serialport/bindings-cpp

      - name: .env 파일 생성 (Supabase 키)
        shell: bash
        run: |
          echo "VITE_SUPABASE_URL=https://fcaoakdlbecamoyeqyha.supabase.co" >> .env
          echo "VITE_SUPABASE_ANON=eyJhbGciOiJIUzI1NiIsInR5cCI6IkpXVCJ9.eyJpc3MiOiJzdXBhYmFzZSIsInJlZiI6ImZjYW9ha2RsYmVjYW1veWVxeWhhIiwicm9sZSI6ImFub24iLCJpYXQiOjE3ODEyMTY1OTYsImV4cCI6MjA5Njc5MjU5Nn0.FlHwYKyddPR_ufi-vCOBFWzgSKE-_xsgGjypV6JVLpY" >> .env

      - name: 빌드 (electron-vite)
        run: pnpm run build

      - name: Windows 패키징 & GitHub Release 업로드
        run: pnpm dist --win --x64 --publish always
        env:
          GH_TOKEN: ${{ secrets.GITHUB_TOKEN }}

      - name: 설치파일 업로드 (Artifacts)
        uses: actions/upload-artifact@v4
        with:
          name: sallaria-pos-windows-x64
          path: dist/*.exe
          if-no-files-found: error
          retention-days: 30

  build-macos:
    runs-on: macos-latest

    steps:
      - uses: actions/checkout@v4

      - uses: pnpm/action-setup@v4
        with:
          version: 9

      - uses: actions/setup-node@v4
        with:
          node-version: 24
          cache: pnpm

      - name: Electron 캐시
        uses: actions/cache@v4
        with:
          path: ~/Library/Caches/electron
          key: electron-macos-${{ hashFiles('package.json') }}

      - name: 패키지 설치
        run: pnpm install

      - name: .env 파일 생성 (Supabase 키)
        run: |
          echo "VITE_SUPABASE_URL=https://fcaoakdlbecamoyeqyha.supabase.co" >> .env
          echo "VITE_SUPABASE_ANON=eyJhbGciOiJIUzI1NiIsInR5cCI6IkpXVCJ9.eyJpc3MiOiJzdXBhYmFzZSIsInJlZiI6ImZjYW9ha2RsYmVjYW1veWVxeWhhIiwicm9sZSI6ImFub24iLCJpYXQiOjE3ODEyMTY1OTYsImV4cCI6MjA5Njc5MjU5Nn0.FlHwYKyddPR_ufi-vCOBFWzgSKE-_xsgGjypV6JVLpY" >> .env

      - name: 인증서 키체인 등록
        run: |
          echo "${{ secrets.MACOS_CERTIFICATE }}" | base64 --decode > certificate.p12
          security create-keychain -p "build" build.keychain
          security list-keychains -d user -s build.keychain $(security list-keychains -d user | sed s/\"//g)
          security default-keychain -s build.keychain
          security unlock-keychain -p "build" build.keychain
          security set-keychain-settings -t 3600 -u build.keychain
          security import certificate.p12 -k build.keychain -P "${{ secrets.MACOS_CERTIFICATE_PWD }}" -T /usr/bin/codesign -T /usr/bin/security
          security set-key-partition-list -S apple-tool:,apple:,codesign: -s -k "build" build.keychain

      - name: Apple 자격증명 진단
        run: |
          xcrun notarytool history \
            --apple-id "$APPLE_ID" \
            --password "$APPLE_APP_SPECIFIC_PASSWORD" \
            --team-id "$APPLE_TEAM_ID" || true
        env:
          APPLE_ID: ${{ secrets.APPLE_ID }}
          APPLE_APP_SPECIFIC_PASSWORD: ${{ secrets.APPLE_ID_PASSWORD }}
          APPLE_TEAM_ID: ${{ secrets.APPLE_TEAM_ID }}

      - name: 빌드 (electron-vite)
        run: pnpm run build

      - name: macOS 패키징 & GitHub Release 업로드
        run: pnpm dist --mac --publish always
        env:
          GH_TOKEN: ${{ secrets.GITHUB_TOKEN }}
          APPLE_ID: ${{ secrets.APPLE_ID }}
          APPLE_APP_SPECIFIC_PASSWORD: ${{ secrets.APPLE_ID_PASSWORD }}
          APPLE_TEAM_ID: ${{ secrets.APPLE_TEAM_ID }}

      - name: 설치파일 업로드 (Artifacts)
        uses: actions/upload-artifact@v4
        with:
          name: sallaria-pos-macos
          path: dist/*.dmg
          if-no-files-found: error
          retention-days: 30
