name: Release

on:
  push:
    tags:
      - 'v*'
  workflow_dispatch:

permissions:
  contents: write

jobs:
  build-windows:
    runs-on: windows-latest

    steps:
      - uses: actions/checkout@v4

      - uses: pnpm/action-setup@v4
        with:
          version: 9

      - uses: actions/setup-node@v4
        with:
          node-version: 24
          cache: pnpm

      - name: Electron 캐시
        uses: actions/cache@v4
        with:
          path: ${{ env.LOCALAPPDATA }}\electron\Cache
          key: electron-windows-${{ hashFiles('package.json') }}

      - name: 패키지 설치
        run: pnpm install

      - name: Native 모듈 Electron용 재빌드
        run: npx @electron/rebuild -f -w @serialport/bindings-cpp

      - name: .env 파일 생성 (Supabase 키)
        shell: bash
        run: |
          echo "VITE_SUPABASE_URL=https://fcaoakdlbecamoyeqyha.supabase.co" >> .env
          echo "VITE_SUPABASE_ANON=eyJhbGciOiJIUzI1NiIsInR5cCI6IkpXVCJ9.eyJpc3MiOiJzdXBhYmFzZSIsInJlZiI6ImZjYW9ha2RsYmVjYW1veWVxeWhhIiwicm9sZSI6ImFub24iLCJpYXQiOjE3ODEyMTY1OTYsImV4cCI6MjA5Njc5MjU5Nn0.FlHwYKyddPR_ufi-vCOBFWzgSKE-_xsgGjypV6JVLpY" >> .env

      - name: 빌드 (electron-vite)
        run: pnpm run build

      - name: Windows 패키징 & GitHub Release 업로드
        run: pnpm dist --win --x64 --publish always
        env:
          GH_TOKEN: ${{ secrets.GITHUB_TOKEN }}

      - name: 설치파일 업로드 (Artifacts)
        uses: actions/upload-artifact@v4
        with:
          name: sallaria-pos-windows-x64
          path: dist/*.exe
          if-no-files-found: error
          retention-days: 30

  build-macos:
    runs-on: macos-latest

    steps:
      - uses: actions/checkout@v4

      - uses: pnpm/action-setup@v4
        with:
          version: 9

      - uses: actions/setup-node@v4
        with:
          node-version: 24
          cache: pnpm

      - name: Electron 캐시
        uses: actions/cache@v4
        with:
          path: ~/Library/Caches/electron
          key: electron-macos-${{ hashFiles('package.json') }}

      - name: 패키지 설치
        run: pnpm install

      - name: .env 파일 생성 (Supabase 키)
        run: |
          echo "VITE_SUPABASE_URL=https://fcaoakdlbecamoyeqyha.supabase.co" >> .env
          echo "VITE_SUPABASE_ANON=eyJhbGciOiJIUzI1NiIsInR5cCI6IkpXVCJ9.eyJpc3MiOiJzdXBhYmFzZSIsInJlZiI6ImZjYW9ha2RsYmVjYW1veWVxeWhhIiwicm9sZSI6ImFub24iLCJpYXQiOjE3ODEyMTY1OTYsImV4cCI6MjA5Njc5MjU5Nn0.FlHwYKyddPR_ufi-vCOBFWzgSKE-_xsgGjypV6JVLpY" >> .env

      - name: 인증서 키체인 등록
        env:
          CERT_PWD: ${{ secrets.MACOS_CERTIFICATE_PWD }}
        run: |
          KEYCHAIN_PATH=$RUNNER_TEMP/app-signing.keychain-db
          KEYCHAIN_PWD="runner-keychain-temp"
          # 시크릿을 붙여넣을 때 끝에 줄바꿈/공백이 딸려 들어가는 일이 흔하다.
          # 그대로 쓰면 "MAC verification failed (wrong password?)" 로 터진다 —
          # 비밀번호가 틀린 게 아니라 \n 이 하나 더 붙은 것이다. 여기서 털어낸다.
          CERT_PWD="$(printf '%s' "$CERT_PWD" | tr -d '\r\n')"
          echo "${{ secrets.MACOS_CERTIFICATE }}" | base64 --decode > /tmp/cert.p12
          security create-keychain -p "$KEYCHAIN_PWD" "$KEYCHAIN_PATH"
          security set-keychain-settings -lut 21600 "$KEYCHAIN_PATH"
          security unlock-keychain -p "$KEYCHAIN_PWD" "$KEYCHAIN_PATH"
          security import /tmp/cert.p12 -k "$KEYCHAIN_PATH" -P "$CERT_PWD" -T /usr/bin/codesign
          # 기존 키체인 목록을 덮어쓰지 않고 앞에 추가 (login.keychain-db 유지)
          security list-keychains -d user -s "$KEYCHAIN_PATH" $(security list-keychains -d user | tr -d '"' | tr -d ' ' | tr '\n' ' ')
          security set-key-partition-list -S apple-tool:,apple: -s -k "$KEYCHAIN_PWD" "$KEYCHAIN_PATH"
          # 어떤 종류의 인증서가 들어왔는지 확인한다.
          # Developer ID Application 이 아니면 서명해봐야 공증에서 전부 거부된다
          # (2026-10-26 릴리즈 실패 원인 — scripts/notarize.js 주석 참고).
          # 그럴 땐 서명을 끄고 빌드해서 **릴리즈 자체는 나오게** 한다.
          security find-identity -v -p codesigning "$KEYCHAIN_PATH"
          if security find-identity -v -p codesigning "$KEYCHAIN_PATH" | grep -q "Developer ID Application"; then
            echo "CSC_IDENTITY_AUTO_DISCOVERY=true" >> $GITHUB_ENV
            echo "✅ Developer ID Application — 서명 + 공증으로 진행합니다"
          else
            echo "CSC_IDENTITY_AUTO_DISCOVERY=false" >> $GITHUB_ENV
            echo "⚠️  Developer ID Application 인증서가 없습니다 — 서명 없이 빌드합니다."
            echo "    (현재 키체인에는 Apple Development 만 있는 것으로 보입니다)"
            echo "    배포용 서명을 켜려면 Developer ID Application 인증서를 발급해"
            echo "    .p12 로 내보낸 뒤 MACOS_CERTIFICATE 시크릿을 교체하세요."
          fi

      - name: 빌드 (electron-vite)
        run: pnpm run build

      - name: macOS 패키징 & GitHub Release 업로드
        run: pnpm dist --mac --publish always
        env:
          GH_TOKEN: ${{ secrets.GITHUB_TOKEN }}
          APPLE_ID: ${{ secrets.APPLE_ID }}
          APPLE_APP_SPECIFIC_PASSWORD: ${{ secrets.APPLE_ID_PASSWORD }}
          APPLE_TEAM_ID: ${{ secrets.APPLE_TEAM_ID }}
          DEBUG: electron-builder

      - name: 설치파일 업로드 (Artifacts)
        uses: actions/upload-artifact@v4
        with:
          name: sallaria-pos-macos
          path: dist/*.dmg
          if-no-files-found: error
          retention-days: 30
